{% extends "base.html" %}

{% block title %}Page Not Found (404) - DiaGuard.ai{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="app-card p-5 my-4 border">
                <div class="brand-icon mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem; background: #fee2e2; color: #ef4444;">
                    <i class="bi bi-exclamation-diamond-fill"></i>
                </div>
                <h1 class="display-4 fw-extrabold text-dark mb-2">404</h1>
                <h4 class="fw-bold text-secondary mb-3">Page Not Found</h4>
                <p class="text-muted small mb-4">
                    The health assessment page, tool, or resource you are looking for does not exist or may have been relocated.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                        <i class="bi bi-house me-1"></i> Back to Home
                    </a>
                    <a href="{{ url_for('quick_check') }}" class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="bi bi-clipboard2-check me-1"></i> Take Risk Test
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

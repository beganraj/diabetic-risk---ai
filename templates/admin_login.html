{% extends "base.html" %}

{% block title %}Admin Login - Diabetes Risk Prediction{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="app-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </span>
                    <h3 class="fw-bold">Admin Portal</h3>
                    <p class="text-muted small">Enter your administrator credentials to access the metrics dashboard.</p>
                </div>

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="admin123" required>
                        </div>
                        <div class="form-text small text-muted">
                            Demo Default: Username: <code>admin</code> | Password: <code>admin123</code>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
